components:
  schemas:
    ReserveSnapshotDTO:
      required:
      - lineOfBusiness
      - snapshotDate
      - snapshotStatus
      - tenantId
      type: object
      properties:
        reserveSnapshotId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        snapshotDate:
          type: string
          format: date
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        currency:
          pattern: "[A-Z]{3}"
          type: string
        snapshotStatus:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - ACCEPTED
        sourceReference:
          maxLength: 128
          minLength: 0
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportingExtractDTO:
      required:
      - extractType
      - preparedAt
      - reserveSnapshotId
      type: object
      properties:
        reportingExtractId:
          type: string
          format: uuid
          readOnly: true
        reserveSnapshotId:
          type: string
          format: uuid
        extractType:
          type: string
          enum:
          - TRIANGLE
          - IFRS17_DATA
          - SOLVENCY_II_DATA
        documentId:
          type: string
          format: uuid
        preparedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TriangleCellDTO:
      required:
      - developmentPeriod
      - originPeriod
      - reserveSnapshotId
      type: object
      properties:
        triangleCellId:
          type: string
          format: uuid
          readOnly: true
        reserveSnapshotId:
          type: string
          format: uuid
        originPeriod:
          maxLength: 16
          minLength: 0
          type: string
        developmentPeriod:
          type: integer
          format: int32
        paidAmount:
          type: number
        incurredAmount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FilterOptions:
      type: object
      properties:
        caseInsensitiveStrings:
          type: boolean
        includeInheritedFields:
          type: boolean
      description: Filter options for customizing filter behavior
    FilterRequestReportingExtractDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReportingExtractDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The zero-based page number to retrieve.
          format: int32
          example: 0
          default: 0
        pageSize:
          type: integer
          description: The number of items per page.
          format: int32
          example: 10
          default: 10
        sortBy:
          type: string
          description: The field to sort the results by.
          example: name
        sortDirection:
          type: string
          description: "The direction of sorting, either ASC or DESC."
          example: DESC
          default: DESC
      description: "Represents a pagination request for retrieving paginated results,\
        \ including page number, size, sort field, and direction."
    RangeFilter:
      type: object
      properties:
        ranges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RangeObject"
          description: Map of field names to their range criteria
      description: Represents range filters for numeric fields
    RangeObject:
      type: object
      properties:
        from:
          type: object
          description: Start value of the range
        to:
          type: object
          description: End value of the range
      description: Represents a range with from and to values
    PaginationResponseReportingExtractDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/ReportingExtractDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
    FilterRequestTriangleCellDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/TriangleCellDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationResponseTriangleCellDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/TriangleCellDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
    FilterRequestReserveSnapshotDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/ReserveSnapshotDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationResponseReserveSnapshotDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/ReserveSnapshotDTO"
        totalElements:
          type: integer
