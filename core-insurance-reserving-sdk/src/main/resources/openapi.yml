  description: One origin and development cell on a loss-development triangle
- name: Reporting Extracts
  description: Reference to a prepared reporting extract. This record is not a regulatory
    filing.
- name: Reserve Snapshots
  description: Point-in-time reserving snapshot supplied by the actuarial process
